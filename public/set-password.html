<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar contraseña | Opti-Way</title>
    <style>
      body {
        margin: 0;
        background-color: #121316;
        color: #9ca3af;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-container {
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 0.8s ease-in-out infinite;
        margin: 0 auto 1rem auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      p {
        font-size: 14px;
        margin: 0 0 1rem 0;
      }
      a {
        color: #3b82f6;
        text-decoration: none;
        font-size: 13px;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      (function() {
        // Preserva el 100% de los parámetros: query string (?...) y hash fragment (#...)
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var target = '/' + search + hash;
        try {
          window.location.replace(target);
        } catch (e) {
          window.location.href = target;
        }
      })();
    </script>
  </head>
  <body>
    <div class="loader-container">
      <div class="spinner"></div>
      <p>Redirigiendo a configurar contraseña...</p>
      <noscript>
        <p>JavaScript es necesario para continuar. Si no eres redirigido automáticamente:</p>
        <a id="manual-link" href="/">Continuar a Opti-Way</a>
      </noscript>
      <script>
        setTimeout(function() {
          var container = document.querySelector('.loader-container');
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var target = '/' + search + hash;
          var link = document.createElement('a');
          link.href = target;
          link.textContent = 'Haz clic aquí si no eres redirigido automáticamente';
          link.style.display = 'block';
          link.style.marginTop = '1rem';
          container.appendChild(link);
        }, 2000);
      </script>
    </div>
  </body>
</html>
